<!doctype html>
<html lang="zh-CN" data-ink-skin="dawn">
<head>
<meta charset="utf-8">
<title>山水画稿 · art harness</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* ---- the two schemes the skin ships ---------------------------------- */
  html[data-ink-skin="dawn"] {
    --ink-far: #7d95a8;
    --ink-mid: #2f424d;
    --ink-near: #17212a;
    --ink-water: #a8b6b8;
    --ink-mist: #fffdf4;
    --ink-sun: #f3d08a;
    --ink-sky-top: #fffdf8;
    --ink-sky-mid: #fbf7ee;
    --ink-sky-low: #f0eade;
    --ink-paper: #faf7ef;
    --ink-veil: 0.12;
  }
  html[data-ink-skin="night"] {
    --ink-far: #40586d;
    --ink-mid: #2b3e4d;
    --ink-near: #131d25;
    --ink-water: #16222b;
    --ink-mist: #a9c4d8;
    --ink-sun: #f2ecd8;
    --ink-sky-top: #0a0f14;
    --ink-sky-mid: #0e161d;
    --ink-sky-low: #22303c;
    --ink-paper: #12171b;
    --ink-veil: 0.20;
  }

  body { background: #000; }
  .stage { position: relative; height: 100vh; overflow: hidden; background: var(--ink-paper); }
  .art { position: absolute; inset: 0; }
  .art svg { display: block; width: 100%; height: 100%; }

  /* ---- the real shell stacks --dsw-alias-bg-base on FOUR layers, so the
     artwork must survive this composite veil: 1-(1-a)^4 ----------------- */
  .veil { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink-paper) 100%, transparent); opacity: 1; }
  /* the container itself must stay transparent, or it hides the artwork */
  .stack { position: absolute; inset: 0; }
  .stack > div { position: absolute; inset: 0; background: var(--ink-paper); opacity: var(--ink-veil); }
  .no-veil .stack { display: none; }

  .tag {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #111;
    background: #ffffffcc; padding: 4px 9px; border-radius: 4px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="art" id="art"><!-- the artwork is inlined here --></div>
  <div class="stack"><div></div><div></div><div></div><div></div></div>
</div>
<div class="tag" id="tag"></div>

<script>
  // `?scheme=night` picks the palette, `?veil=0` shows the raw artwork.
  const q = new URLSearchParams(location.search)
  if (q.get('scheme') === 'night') document.documentElement.dataset.inkSkin = 'night'
  if (q.get('veil') === '0') document.body.classList.add('no-veil')
  document.getElementById('tag').textContent =
    `scheme=${document.documentElement.dataset.inkSkin} veil=${q.get('veil') === '0' ? 'off' : 'on'}`

  // Inline `../art/scene.svg` so the harness is a single visual surface.
  fetch('./scene.svg').then((r) => r.text()).then((text) => {
    document.getElementById('art').innerHTML = text
  })
</script>
</body>
</html>
